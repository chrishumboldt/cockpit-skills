# Idea 2 Backlog: an idea through design, preflight and a spec, into backlog items on the base branch. Nothing is built.
name: Idea 2 Backlog
description: Ask for a design, preflight an idea, write and review its spec, then add it to the project's backlog as items with their dependencies.

steps:
  design:
    name: Design
    role: planner
    skill: cockpit/design-intake
    interactive: true
    writes: [design.md]
    outcomes: [DESIGN, NONE]

  preflight:
    name: Preflight
    role: planner
    skill: cockpit/preflight
    interactive: true
    context: { transcript: design }
    reads: [design.md]
    prompt: Read `{{run.folder}}/design.md`; when it holds a design, question the idea against it. Read the backlog in `docs/backlog/` for items this idea overlaps or depends on. Write your notes to `{{run.folder}}/preflight-notes.md`.
    writes: [preflight-notes.md]

  spec:
    name: Write spec
    role: planner
    skill: cockpit/write-spec
    context: { transcript: preflight }
    reads: [preflight-notes.md, design.md, transcript-design.md]
    prompt: Write the spec to `{{run.folder}}/spec.md` from `{{preflight.file}}`, `{{run.folder}}/transcript-design.md` (the idea as first told) and `{{run.folder}}/design.md`. It goes into the backlog, not an issue tracker; leave out the `Issue:` line.
    writes: [spec.md]

  review-spec:
    name: Review spec
    gate: approval
    shows: spec.md
    on:
      CHANGES: spec
      REJECT: end

  items:
    name: Write backlog items
    role: planner
    skill: cockpit/backlog-items
    reads: [spec.md]
    writes: [items.md]
    outcomes: [READY]
    prompt: Split `{{spec.file}}` into backlog items in `docs/backlog/`, save the spec in `docs/backlog/specs/`, commit them on `{{run.branch}}`, and write the index the next gate shows to `{{run.folder}}/items.md`.

  approve-items:
    name: Approve items
    gate: approval
    shows: items.md
    on:
      CHANGES: items
      REJECT: end

  # Merges the run's branch into the base as one merge commit, in the run worktree, and pushes the base.
  # The user's own checkout catches up on its next pull.
  land:
    name: Add to backlog
    run: |-
      sh -c '
      set -e
      branch=$1 base=$2
      # Main may move while this merges (another session pushing): fetch, merge and push again.
      for try in 1 2 3; do
        git fetch -q origin "$base"
        git checkout -q --detach "origin/$base"
        git merge --no-ff --no-edit -m "Backlog: $(git log -1 --format=%s "$branch")" "$branch"
        if git push -q origin "HEAD:$base"; then break; fi
        [ "$try" = 3 ] && exit 1
        echo "$base moved while merging; trying again" >&2
        sleep 2
      done
      echo "Added to the backlog on $base as $(git rev-parse --short HEAD)"
      git checkout -q "$branch"
      ' sh {{run.branch}} {{run.base}}
