# Idea 2 Shipped: Idea 2 Backlog, then Backlog 2 Shipped on the items it wrote, in one run (Cockpit spec §9.5).
name: Idea 2 Shipped
description: Ask for a design, preflight an idea into a spec and backlog items, build each with review, review the whole and fix what it finds, then merge into the base branch with the items marked done.

steps:
  design:
    name: Design
    role: planner
    skill: cockpit/design-intake
    interactive: true
    writes: [design.md]
    outcomes: [DESIGN, NONE]

  preflight:
    name: Preflight
    role: planner
    skill: cockpit/preflight
    interactive: true
    context: { transcript: design }
    reads: [design.md]
    prompt: Read `{{run.folder}}/design.md`; when it holds a design, question the idea against it. Read the backlog in `docs/backlog/` for items this idea overlaps or depends on. Write your notes to `{{run.folder}}/preflight-notes.md`.
    writes: [preflight-notes.md]

  spec:
    name: Write spec
    role: planner
    skill: cockpit/write-spec
    context: { transcript: preflight }
    reads: [preflight-notes.md, design.md, transcript-design.md]
    prompt: Write the spec to `{{run.folder}}/spec.md` from `{{preflight.file}}`, `{{run.folder}}/transcript-design.md` (the idea as first told) and `{{run.folder}}/design.md`. It goes into the backlog, not an issue tracker; leave out the `Issue:` line.
    writes: [spec.md]

  review-spec:
    name: Review spec
    gate: approval
    shows: spec.md
    on:
      CHANGES: spec
      REJECT: end

  items:
    name: Write backlog items
    role: planner
    skill: cockpit/backlog-items
    reads: [spec.md]
    writes: [items.md]
    outcomes: [READY]
    prompt: Split `{{spec.file}}` into backlog items in `docs/backlog/`, save the spec in `docs/backlog/specs/`, commit them on `{{run.branch}}`, and write the index the next gate shows to `{{run.folder}}/items.md`.

  approve-items:
    name: Approve items
    gate: approval
    shows: items.md
    on:
      CHANGES: items
      REJECT: end

  # Turns the items this run just wrote into its tickets, asking nothing.
  pick:
    name: Pick items
    role: planner
    skill: cockpit/backlog-pick
    reads: [items.md]
    writes: [picks.txt, tickets.md, tickets.json, 'tickets/*.md']
    outcomes: [READY]
    prompt: Pick exactly the items `{{run.folder}}/items.md` lists, the ones this run wrote, without asking, and write the run's tickets to `{{run.folder}}`. Keep `{{run.folder}}/spec.md` as it is.

  implement:
    name: Implement
    foreach: tickets.frontier
    steps:
      implement:
        name: Implement
        role: implementer
        skill: cockpit/implement
        reads: [spec.md, 'tickets/*.md', 'review-*.md']
        writes: [build.md]
        prompt: Implement ticket {{item.id}}, {{item.title}}, from `{{run.folder}}/{{item.file}}` and the spec in `{{run.folder}}/spec.md`. Run the tests that cover what you changed. Write what you built to `build.md`.

      review:
        name: Review
        parallel:
          code-review:
            name: Code review
            role: reviewer
            skill: cockpit/code-review
            prompt: Review ticket {{item.id}}'s change for correctness against `{{run.folder}}/{{item.file}}` and `{{run.folder}}/spec.md`; write the review to `review-code.md`.
          code-smell:
            name: Code smell
            role: smell-checker
            skill: cockpit/code-review
            prompt: Review ticket {{item.id}}'s change for code smells only; write the review to `review-smell.md`.
        writes: ['review-*.md']
        outcomes: [PASS, CHANGES]
        on:
          CHANGES: { to: implement, max: 2 }

      merge:
        name: Merge
        run: git merge --no-ff {{item.branch}}
        on_stop: git merge --abort

  final-review:
    name: Final review
    parallel:
      code-review:
        name: Code review
        role: reviewer
        skill: cockpit/code-review
        prompt: Review the integration branch `{{run.branch}}` as a whole for correctness against `{{run.folder}}/spec.md`; write the review to `{{run.folder}}/final-review-code.md`.
      code-smell:
        name: Code smell
        role: smell-checker
        skill: cockpit/code-review
        prompt: Review the integration branch `{{run.branch}}` as a whole for code smells only; write the review to `{{run.folder}}/final-review-smell.md`.
    writes: ['final-review-*.md']
    outcomes: [PASS, CHANGES]
    on:
      PASS: ship
      CHANGES: fix

  # Fixes what Final review or Ship's Request changes found, on the integration branch.
  fix:
    name: Fix
    role: implementer
    skill: cockpit/implement
    reads: ['final-review-*.md', spec.md, gate-ship.md]
    writes: [fix.md]
    outcomes: [DONE]
    prompt: This round fixes the integration branch `{{run.branch}}` as a whole, not a ticket. Fix what `{{run.folder}}/final-review-code.md` and `{{run.folder}}/final-review-smell.md` ask for, and, when it exists, the user's notes in `{{run.folder}}/gate-ship.md`, against `{{run.folder}}/spec.md`. Write what you changed to `{{run.folder}}/fix.md`.
    on:
      DONE: { to: final-review, max: 3 }

  ship:
    name: Ship
    gate: approval
    shows: final-review-code.md
    prompt: 'Ship `{{run.branch}}`: merge it into `{{run.base}}` and mark the items done?'
    on:
      CHANGES: fix
      REJECT: end

  # Marks the picked items done on the branch, merges it into the base as one merge commit, and pushes the base.
  land:
    name: Merge
    run: |-
      sh -c '
      set -e
      branch=$1 base=$2 picks=$3
      today=$(date +%F)
      while read -r f; do
        [ -n "$f" ] || continue
        sed -i "s/^status: .*/status: done/" "$f"
        grep -q "^done:" "$f" || sed -i "s/^added: .*/&\ndone: $today/" "$f"
      done < "$picks"
      git add docs/backlog && git commit -q -m "Backlog: mark $(tr "\n" " " < "$picks" | sed "s#docs/backlog/##g; s#-[^ ]*##g; s/ *$//") done" || true
      git fetch -q origin "$base"
      git checkout -q --detach "origin/$base"
      git merge --no-ff --no-edit "$branch"
      git push -q origin "HEAD:$base"
      echo "Merged into $base as $(git rev-parse --short HEAD)"
      ' sh {{run.branch}} {{run.base}} {{run.folder}}/picks.txt
