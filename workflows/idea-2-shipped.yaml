# Idea 2 Shipped: Idea 2 Tickets, then implement, final review and fix, ship, open the pull request and merge it (Cockpit spec §9.5).
name: Idea 2 Shipped
description: Ask for a design, preflight an idea into a spec and tickets, build each ticket with review, review the whole and fix what it finds, then open a pull request and merge it.

steps:
  # Optional: it asks once for a design and always writes design.md, a one-liner when declined.
  design:
    name: Design
    role: planner
    skill: cockpit/design-intake
    interactive: true
    writes: [design.md]
    outcomes: [DESIGN, NONE]

  preflight:
    name: Preflight
    role: planner
    skill: cockpit/preflight
    interactive: true
    context: { transcript: design }
    reads: [design.md]
    prompt: Read `{{run.folder}}/design.md`; when it holds a design, question the idea against it. Write your notes to `{{run.folder}}/preflight-notes.md`.
    writes: [preflight-notes.md]

  spec:
    name: Write spec
    role: planner
    skill: cockpit/write-spec
    context: { transcript: preflight }
    reads: [preflight-notes.md, design.md, transcript-design.md]
    prompt: Write the spec to `{{run.folder}}/spec.md` from `{{preflight.file}}`, `{{run.folder}}/transcript-design.md` (the idea as first told) and `{{run.folder}}/design.md`.
    writes: [spec.md]

  review-spec:
    name: Review spec
    gate: approval
    shows: spec.md
    on:
      CHANGES: spec
      REJECT: end

  tickets:
    name: Break into tickets
    role: planner
    skill: cockpit/to-tickets
    reads: [spec.md]
    writes: [tickets.md, tickets.json, 'tickets/*.md']
    outcomes: [READY]
    prompt: Break `{{spec.file}}` into tickets in `{{run.folder}}`.

  approve-tickets:
    name: Approve tickets
    gate: approval
    shows: tickets.md
    on:
      CHANGES: tickets
      REJECT: end

  implement:
    name: Implement
    foreach: tickets.frontier
    steps:
      implement:
        name: Implement
        role: implementer
        skill: cockpit/implement
        reads: [spec.md, 'tickets/*.md', 'review-*.md']
        writes: [build.md]
        prompt: Implement ticket {{item.id}}, {{item.title}}, from `{{run.folder}}/{{item.file}}` and the spec in `{{spec.file}}`. Write what you built to `build.md`.

      review:
        name: Review
        parallel:
          code-review:
            name: Code review
            role: reviewer
            skill: cockpit/code-review
            prompt: Review ticket {{item.id}}'s change for correctness against `{{run.folder}}/{{item.file}}` and `{{spec.file}}`; write the review to `review-code.md`.
          code-smell:
            name: Code smell
            role: smell-checker
            skill: cockpit/code-review
            prompt: Review ticket {{item.id}}'s change for code smells only; write the review to `review-smell.md`.
        writes: ['review-*.md']
        outcomes: [PASS, CHANGES]
        on:
          CHANGES: { to: implement, max: 2 }

      merge:
        name: Merge
        run: git merge --no-ff {{item.branch}}
        on_stop: git merge --abort

  final-review:
    name: Final review
    parallel:
      code-review:
        name: Code review
        role: reviewer
        skill: cockpit/code-review
        prompt: Review the integration branch `{{run.branch}}` as a whole for correctness against `{{spec.file}}`; write the review to `{{run.folder}}/final-review-code.md`.
      code-smell:
        name: Code smell
        role: smell-checker
        skill: cockpit/code-review
        prompt: Review the integration branch `{{run.branch}}` as a whole for code smells only; write the review to `{{run.folder}}/final-review-smell.md`.
    writes: ['final-review-*.md']
    outcomes: [PASS, CHANGES]
    on:
      PASS: ship
      CHANGES: fix

  # Fixes what Final review or Ship's Request changes found, on the integration branch.
  fix:
    name: Fix
    role: implementer
    skill: cockpit/implement
    reads: ['final-review-*.md', spec.md, gate-ship.md]
    writes: [fix.md]
    outcomes: [DONE]
    prompt: This round fixes the integration branch `{{run.branch}}` as a whole, not a ticket. Fix what `{{run.folder}}/final-review-code.md`, `{{run.folder}}/final-review-smell.md` and, when it exists, `{{run.folder}}/gate-ship.md` ask for, against `{{spec.file}}`, and write what you changed to `{{run.folder}}/fix.md`.
    on:
      DONE: { to: final-review, max: 2 }

  ship:
    name: Ship
    gate: approval
    shows: final-review-code.md
    prompt: 'Ship `{{run.branch}}`: open its pull request and merge it into `{{run.base}}`?'
    on:
      CHANGES: fix
      REJECT: end

  # Titled by the spec's heading and its issue; the body opens with "Closes #N" when the spec names one.
  # A missing spec stops it before anything is pushed.
  publish:
    name: Open pull request
    run: test -f {{spec.file}} && git push -u origin {{run.branch}} && printf '%s\n\n' {{spec.preface}} | cat - {{spec.file}} | gh pr create --head {{run.branch}} --base {{run.base}} --title {{spec.title}} --body-file -

  # Asks GitHub to merge the pull request as a merge commit once its required checks pass (--auto), now
  # when there are none. The remote branch is deleted only after the merge is done, and only if it is
  # still there (GitHub may have deleted it); a pull request that is only queued keeps its branch. The
  # last line says which: the merge commit, or that the merge is waiting on the checks.
  merge-pr:
    name: Merge pull request
    run: |-
      sh -c '
      branch=$1
      gh pr merge "$branch" --merge --auto || exit 1
      info=$(gh pr view "$branch" --json state,url,mergeCommit --jq "[.state, .url, ((.mergeCommit.oid // \"\")[0:7])] | @tsv") || exit 1
      set -- $info
      state=$1 url=$2 commit=$3
      if [ "$state" = MERGED ]; then
        if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
          git push origin --delete "$branch" || exit 1
        fi
        echo "Merged $url as $commit"
      else
        echo "Auto-merge is set on $url: it merges when the required checks pass, and its branch stays until then"
      fi
      ' sh {{run.branch}}
