# Backlog 2 Shipped: pick ready backlog items, build them in lanes, check and look, then merge into the base and mark them done.
name: Backlog 2 Shipped
description: Pick items from the project's backlog, build each with review, run the project's checks, look at the result, then merge into the base branch and mark the items done.

steps:
  pick:
    name: Pick items
    role: planner
    skill: cockpit/backlog-pick
    interactive: true
    writes: [picks.txt, spec.md, tickets.md, tickets.json, 'tickets/*.md']
    outcomes: [READY, NONE]
    prompt: Offer the ready items in `docs/backlog/`, ask which to build, and write the run's tickets to `{{run.folder}}`.
    on:
      NONE: end

  implement:
    name: Implement
    foreach: tickets.frontier
    steps:
      implement:
        name: Implement
        role: implementer
        skill: cockpit/implement
        reads: [spec.md, 'tickets/*.md', 'review-*.md']
        writes: [build.md]
        prompt: Implement ticket {{item.id}}, {{item.title}}, from `{{run.folder}}/{{item.file}}` and the spec in `{{run.folder}}/spec.md`. Run the tests that cover what you changed; the full suites run later in the Checks step. Write what you built to `build.md`.

      review:
        name: Review
        parallel:
          code-review:
            name: Code review
            role: reviewer
            skill: cockpit/code-review
            prompt: Review ticket {{item.id}}'s change for correctness against `{{run.folder}}/{{item.file}}` and `{{run.folder}}/spec.md`; write the review to `review-code.md`.
          code-smell:
            name: Code smell
            role: smell-checker
            skill: cockpit/code-review
            prompt: Review ticket {{item.id}}'s change for code smells only; write the review to `review-smell.md`.
        writes: ['review-*.md']
        outcomes: [PASS, CHANGES]
        on:
          CHANGES: { to: implement, max: 2 }

      merge:
        name: Merge
        run: git merge --no-ff {{item.branch}}
        on_stop: git merge --abort

  final-review:
    name: Final review
    parallel:
      code-review:
        name: Code review
        role: reviewer
        skill: cockpit/code-review
        prompt: Review the integration branch `{{run.branch}}` as a whole for correctness against `{{run.folder}}/spec.md`; write the review to `{{run.folder}}/final-review-code.md`.
      code-smell:
        name: Code smell
        role: smell-checker
        skill: cockpit/code-review
        prompt: Review the integration branch `{{run.branch}}` as a whole for code smells only; write the review to `{{run.folder}}/final-review-smell.md`.
    writes: ['final-review-*.md']
    outcomes: [PASS, CHANGES]
    on:
      PASS: checks
      CHANGES: fix

  # Fixes what Final review, the checks or the user at Look found, on the integration branch.
  fix:
    name: Fix
    role: implementer
    skill: cockpit/implement
    reads: ['final-review-*.md', spec.md, gate-look.md, checks.log]
    writes: [fix.md]
    outcomes: [DONE]
    prompt: This round fixes the integration branch `{{run.branch}}` as a whole, not a ticket. Fix what `{{run.folder}}/final-review-code.md` and `{{run.folder}}/final-review-smell.md` ask for, and, when they exist, the user's notes in `{{run.folder}}/gate-look.md` and the failures at the end of `{{run.folder}}/checks.log`, against `{{run.folder}}/spec.md`. Write what you changed to `{{run.folder}}/fix.md`.
    on:
      DONE: { to: final-review, max: 3 }

  # The project's own full checks: `.cockpit-hooks/checks`, when the project has one. Its output is kept in checks.log for Fix.
  checks:
    name: Checks
    run: |-
      sh -c '
      log=$1/checks.log
      if [ ! -x .cockpit-hooks/checks ]; then echo "No .cockpit-hooks/checks in this project: skipped" | tee "$log"; exit 0; fi
      .cockpit-hooks/checks > "$log" 2>&1; rc=$?
      tail -40 "$log"; exit $rc
      ' sh {{run.folder}}
    on:
      FAIL: { to: fix, max: 2 }

  # look.md for the gate: what was built and fixed, then the project's look hook (screenshots) for the items' shots.
  shots:
    name: Shots
    run: |-
      sh -c '
      set -e
      folder=$1 look=$1/look.md
      shots=$(sed -n "s/^shots: *//p" $(cat "$folder/picks.txt") | tr "," "\n" | sed "s/ //g" | sort -u | tr "\n" " ")
      { sed -n "1p" "$folder/spec.md"; echo
        for f in "$folder"/lanes/*/build.md "$folder/fix.md"; do [ -f "$f" ] && { cat "$f"; echo; }; done
        echo "## Look"; } > "$look"
      if [ -x .cockpit-hooks/look ] && [ -n "${shots% }" ]; then .cockpit-hooks/look "$folder" $shots >> "$look"
      else echo "No screenshots: the items name no shots, or the project has no .cockpit-hooks/look." >> "$look"; fi
      ' sh {{run.folder}}

  look:
    name: Look and ship
    gate: approval
    shows: look.md
    prompt: 'Look at the result. Approve merges `{{run.branch}}` into `{{run.base}}` and marks the items done.'
    on:
      CHANGES: fix
      REJECT: end

  # Marks the picked items done on the branch, merges it into the base as one merge commit, and pushes the base.
  land:
    name: Merge
    run: |-
      sh -c '
      set -e
      branch=$1 base=$2 picks=$3
      today=$(date +%F)
      while read -r f; do
        [ -n "$f" ] || continue
        sed -i "s/^status: .*/status: done/" "$f"
        grep -q "^done:" "$f" || sed -i "s/^added: .*/&\ndone: $today/" "$f"
      done < "$picks"
      git add docs/backlog && git commit -q -m "Backlog: mark $(tr "\n" " " < "$picks" | sed "s#docs/backlog/##g; s#-[^ ]*##g; s/ *$//") done" || true
      git fetch -q origin "$base"
      git checkout -q --detach "origin/$base"
      git merge --no-ff --no-edit "$branch"
      git push -q origin "HEAD:$base"
      echo "Merged into $base as $(git rev-parse --short HEAD)"
      ' sh {{run.branch}} {{run.base}} {{run.folder}}/picks.txt
