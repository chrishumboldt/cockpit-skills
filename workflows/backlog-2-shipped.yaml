# Backlog 2 Shipped: pick ready backlog items, build them in lanes, review the whole, then merge into the base and mark them done.
name: Backlog 2 Shipped
description: Pick items from the project's backlog, build each with review, review the whole and fix what it finds, then merge into the base branch and mark the items done.

steps:
  pick:
    name: Pick items
    role: planner
    skill: cockpit/backlog-pick
    interactive: true
    writes: [picks.txt, spec.md, tickets.md, tickets.json, 'tickets/*.md']
    outcomes: [READY, NONE]
    prompt: Offer the ready items in `docs/backlog/`, ask which to build, and write the run's tickets to `{{run.folder}}`.
    on:
      NONE: end

  implement:
    name: Implement
    foreach: tickets.frontier
    steps:
      implement:
        name: Implement
        role: implementer
        skill: cockpit/implement
        reads: [spec.md, 'tickets/*.md', 'review-*.md']
        writes: [build.md]
        prompt: Implement ticket {{item.id}}, {{item.title}}, from `{{run.folder}}/{{item.file}}` and the spec in `{{run.folder}}/spec.md`. Run the tests that cover what you changed. Write what you built to `build.md`.

      # Correctness per ticket, while the lane's agent has the context; smells wait for the
      # final review, which sees the whole branch.
      review:
        name: Code review
        role: reviewer
        skill: cockpit/code-review
        prompt: Review ticket {{item.id}}'s change for correctness against `{{run.folder}}/{{item.file}}` and `{{run.folder}}/spec.md`; write the review to `review-code.md`.
        writes: [review-code.md]
        outcomes: [PASS, CHANGES]
        on:
          CHANGES: { to: implement, max: 2 }

      # A conflicted merge aborts, so the run worktree stays clean and Retry works; the log names the files.
      # The conflict goes to Resolve merge, which merges the run branch into the lane in the lane's own worktree, before it goes to the user. Merge below then
      # merges the lane cleanly (or fails to the user if the run branch moved again).
      # Merge's run: below is a copy of this script (and the same in the other shipped workflow); change all together.
      try-merge:
        name: Try merge
        # Merges without committing so a numbered file the lane adds beside one with the same number (two 0040- ADRs with different slugs, which git merges without a conflict) counts as a conflict too.
        run: |-
          sh -c '
          # Merge without committing, so a conflict aborts and leaves the worktree clean.
          git merge --no-ff --no-commit "$1" || { git diff --name-only --diff-filter=U; git merge --abort; exit 1; }
          # Files the run branch added since the lane forked, to compare the new files of the lane against.
          base=$(git merge-base HEAD "$1")
          # Numbered clash: a file the lane adds whose NNNN- prefix a run-branch file already uses in that folder. Dated names (2026-10-30-x) are not numbers.
          clash=$(git diff --cached --name-only --diff-filter=A HEAD | while read -r f; do
            n=$(basename "$f" | grep -oE "^[0-9]+-") || continue
            case $(basename "$f") in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]*) continue;; esac
            git diff --name-only --diff-filter=A "$base" HEAD -- "$(dirname "$f")/$n*"
          done)
          [ -z "$clash" ] || { echo "Numbered files clash: $clash"; git merge --abort; exit 1; }
          # Commit the merge; a failed commit aborts it.
          git rev-parse -q --verify MERGE_HEAD >/dev/null && { git commit -q --no-edit --no-verify || { git merge --abort; exit 1; }; }
          exit 0
          ' sh {{item.branch}}
        on_stop: git merge --abort
        on:
          PASS: merge
          FAIL: resolve

      resolve:
        name: Resolve merge
        role: implementer
        skill: cockpit/resolve-merge
        reads: [spec.md, 'tickets/*.md']
        writes: [resolve.md]
        outcomes: [DONE]
        prompt: Merging `{{item.branch}}` into `{{run.branch}}` conflicted, or added a numbered file that clashes. In this lane's worktree, merge `{{run.branch}}` into `{{item.branch}}`, resolve the conflicts keeping both sides against the tickets in `{{run.folder}}/tickets/` and `{{run.folder}}/spec.md` (this lane's is `{{run.folder}}/{{item.file}}`), renumber clashing numbered files, run the focused tests and commit the merge on `{{item.branch}}`. Write what you did to `resolve.md`.

      merge:
        name: Merge resolved lane
        # The same script as Try merge, so a numbered clash that Resolve merge left in place fails to the user too. Keep the two in sync.
        run: |-
          sh -c '
          # Merge without committing, so a conflict aborts and leaves the worktree clean.
          git merge --no-ff --no-commit "$1" || { git diff --name-only --diff-filter=U; git merge --abort; exit 1; }
          # Files the run branch added since the lane forked, to compare the new files of the lane against.
          base=$(git merge-base HEAD "$1")
          # Numbered clash: a file the lane adds whose NNNN- prefix a run-branch file already uses in that folder. Dated names (2026-10-30-x) are not numbers.
          clash=$(git diff --cached --name-only --diff-filter=A HEAD | while read -r f; do
            n=$(basename "$f" | grep -oE "^[0-9]+-") || continue
            case $(basename "$f") in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]*) continue;; esac
            git diff --name-only --diff-filter=A "$base" HEAD -- "$(dirname "$f")/$n*"
          done)
          [ -z "$clash" ] || { echo "Numbered files clash: $clash"; git merge --abort; exit 1; }
          # Commit the merge; a failed commit aborts it.
          git rev-parse -q --verify MERGE_HEAD >/dev/null && { git commit -q --no-edit --no-verify || { git merge --abort; exit 1; }; }
          exit 0
          ' sh {{item.branch}}
        on_stop: git merge --abort

  final-review:
    name: Final review
    parallel:
      code-review:
        name: Code review
        role: reviewer
        skill: cockpit/code-review
        prompt: Review the integration branch `{{run.branch}}` as a whole for correctness against `{{run.folder}}/spec.md`; write the review to `{{run.folder}}/final-review-code.md`.
      code-smell:
        name: Code smell
        role: smell-checker
        skill: cockpit/code-review
        prompt: Review the integration branch `{{run.branch}}` as a whole for code smells only; write the review to `{{run.folder}}/final-review-smell.md`.
    writes: ['final-review-*.md']
    outcomes: [PASS, CHANGES]
    on:
      PASS: ship
      CHANGES: fix

  # Fixes what Final review or Ship's Request changes found, on the integration branch.
  fix:
    name: Fix
    role: implementer
    skill: cockpit/implement
    reads: ['final-review-*.md', spec.md, gate-ship.md]
    writes: [fix.md]
    outcomes: [DONE]
    prompt: This round fixes the integration branch `{{run.branch}}` as a whole, not a ticket. Fix what `{{run.folder}}/final-review-code.md` and `{{run.folder}}/final-review-smell.md` ask for, and, when it exists, the user's notes in `{{run.folder}}/gate-ship.md`, against `{{run.folder}}/spec.md`. Write what you changed to `{{run.folder}}/fix.md`.
    on:
      DONE: { to: final-review, max: 3 }

  ship:
    name: Ship
    gate: approval
    shows: final-review-code.md
    prompt: 'Ship `{{run.branch}}`: merge it into `{{run.base}}` and mark the items done?'
    on:
      CHANGES: fix
      REJECT: end

  # Merges the branch into the fetched base as one merge commit, marks the picked items done on top of it, and pushes the base.
  land:
    name: Merge
    run: |-
      sh -c '
      set -e
      branch=$1 base=$2 picks=$3
      today=$(date +%F)
      # Main may move while this merges (another session pushing): fetch, merge, mark and push again.
      # Items are marked on the merged tree, so one filed or edited on the base since the branch was cut is there too.
      for try in 1 2 3; do
        git fetch -q origin "$base"
        git checkout -q --detach "origin/$base"
        git merge --no-ff --no-edit -m "Merge $branch into $base" "$branch"
        marked= missed=
        while read -r f; do
          [ -n "$f" ] || continue
          n=$(basename "$f" | sed "s/-.*//")
          if [ ! -f "$f" ]; then
            echo "$n not on the base: not marked done"
            missed="$missed $n"
            continue
          fi
          sed -i "s/^status: .*/status: done/" "$f"
          grep -q "^done:" "$f" || sed -i "s/^added: .*/&\ndone: $today/" "$f"
          marked="$marked $n"
        done < "$picks"
        git add docs/backlog
        git diff --cached --quiet || git commit -q -m "Backlog: mark$marked done"
        if git push -q origin "HEAD:$base"; then break; fi
        [ "$try" = 3 ] && exit 1
        echo "$base moved while merging; trying again" >&2
        sleep 2
      done
      echo "Merged into $base as $(git rev-parse --short HEAD)"
      [ -z "$missed" ] || echo "Not marked done:$missed"
      git checkout -q "$branch"
      ' sh {{run.branch}} {{run.base}} {{run.folder}}/picks.txt
